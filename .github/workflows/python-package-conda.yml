name: Python checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy matplotlib openpyxl

      - name: Byte-compile all Python scripts
        run: python -m compileall -q scripts

      - name: Re-export the supplementary tables from results/ and compare with tables/
        run: |
          python scripts/python/export_online_resources.py
          git diff --exit-code --ignore-cr-at-eol -- tables/

      - name: Regenerate the result figures from results/ (smoke test)
        working-directory: scripts/python/figures
        env:
          FIG_OUT: ${{ runner.temp }}/figures
        run: |
          python make_fig01_discovery_108.py
          python make_fig02_celltype_108.py
          python make_figs345_108.py
          python make_fig06_atlas_108.py
          ls -la "$FIG_OUT"
