name: R checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R (release)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Parse all R scripts (syntax check; the Bioconductor pipeline itself runs in the project container)
        run: |
          files <- list.files("scripts/R", pattern = "[.]R$", full.names = TRUE)
          for (f in files) { parse(f, encoding = "UTF-8"); cat("ok", f, "\n") }
          cat(length(files), "R scripts parsed\n")
        shell: Rscript {0}
